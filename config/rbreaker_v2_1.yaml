# R-Breaker MOEX 2.1 — базовая конфигурация (спецификация §107).
# Блок `assumptions` — параметры, которых нет в спецификации; см. docs/ASSUMPTIONS.md.

strategy:
  version: "2.1"

instruments:
  - MX
  - RN
  - CR
  - GD

session:
  opening_cooldown_minutes: 15
  stop_new_entries_before_close_minutes: 20
  force_close_before_close_minutes: 15

rbreaker:
  setup_coefficient: 0.35
  reversal_coefficient: 0.07
  breakout_coefficient: 0.25

atr:
  timeframe_minutes: 10
  period: 14
  method: SMA

risk:
  breakout_fraction: 0.005
  reversal_fraction: 0.0035
  portfolio_max_open_risk: 0.0125
  group_max_open_risk: 0.0075
  max_margin_fraction: 0.25

stops:
  breakout_initial_atr: 1.5
  breakout_trailing_atr: 1.5
  reversal_initial_atr: 1.0
  reversal_trailing_atr: 1.0

limits:
  max_entries_per_instrument_per_day: 4
  daily_loss_fraction: 0.02
  weekly_loss_fraction: 0.04
  reduce_risk_drawdown: 0.08
  halt_drawdown: 0.12

liquidity:
  median_volume_days: 20
  minimum_median_volume: 10000
  maximum_spread_fraction: 0.0005
  maximum_spread_of_stop: 0.10

execution:
  entry_timeout_seconds: 10
  maximum_slippage_fraction: 0.0005
  maximum_slippage_of_stop: 0.10

market_data:
  max_quote_age_ms: 5000

range_filter:
  enabled: false

news_filter:
  enabled: false

# ---------------------------------------------------------------------------
# Параметры вне спецификации (требуют подтверждения владельцем стратегии).
# ---------------------------------------------------------------------------
assumptions:
  initial_equity: 1000000.0          # RUB
  # Торговое окно (МСК). Спецификация не уточняет, какие сессии торговать (A-01).
  trading_windows_msk:
    - ["10:00", "18:50"]
  # Граница торгового дня FORTS: всё, что после неё, относится к следующему торговому дню (A-02).
  trading_day_boundary_msk: "19:00"
  # Модель гарантийного обеспечения для истории: доля от номинала (A-07).
  historical_margin_fraction_of_notional: 0.15
  # Комиссия (A-06): НЕ подтверждена. Заменить фактическим тарифом «Премиум/Private».
  commission_model:
    broker_fraction_of_notional: 0.0004
    exchange_fraction_of_notional: 0.0000
  # Модель исполнения на свечах (A-05), в шагах цены на одну сторону.
  default_spread_ticks: 1.0
  default_slippage_ticks: 1.0
  instrument_overrides: {}
  # Досрочная перекладка без исторического спреда не применяется (A-08).
  early_roll_requires_spread_data: true
