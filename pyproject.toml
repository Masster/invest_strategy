[project]
name = "moexlab"
version = "0.1.0"
description = "Research platform for MOEX futures/equity trading strategies (T-Invest execution target)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0", "requests>=2.28", "matplotlib>=3.7", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
