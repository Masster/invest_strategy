[project]
name = "rbreaker-moex"
version = "2.1.0"
description = "R-Breaker MOEX 2.1: research backtester and strategy core"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyyaml>=6.0", "requests>=2.28", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
